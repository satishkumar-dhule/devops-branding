name: Approver Validation
description: Validates that required reviewers are configured in the environment and waits for approval.

inputs:
  environment:
    description: The GitHub environment.
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate Environment Approvers
      uses: actions/github-script@v6
      with:
        script: |
          const environmentName = '${{ inputs.environment }}';
          const apiUrl = `https://api.github.com/repos/${{ github.repository }}/environments/${environmentName}`;
          
          const response = await fetch(apiUrl, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${{ secrets.GITHUB_TOKEN }}`
            }
          });

          const data = await response.json();

          // Check if required reviewers exist
          const reviewers = data.protection?.required_reviewers;
          if (!reviewers || reviewers.length === 0) {
            core.setFailed(`❌ No required reviewers are configured for environment: ${environmentName}`);
          } else {
            console.log(`✅ Required reviewers are configured for environment: ${environmentName}`);
          }

    - name: Print Message When Approved
      uses: actions/github-script@v6
      with:
        script: |
          const environmentName = '${{ inputs.environment }}';
          const approvalApiUrl = `https://api.github.com/repos/${{ github.repository }}/deployment_statuses`;

          // Fetch the approval status of the environment
          const approvalResponse = await fetch(approvalApiUrl, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${{ secrets.GITHUB_TOKEN }}`
            }
          });

          const approvalData = await approvalResponse.json();

          // Find the deployment status for the environment
          const approvalStatus = approvalData.find(status => status.environment === environmentName);

          // Print a message when the environment is approved
          if (approvalStatus && approvalStatus.state === 'success') {
            console.log(`✅ Environment ${environmentName} has been approved.`);
          } else {
            console.log(`⏳ Waiting for approval for environment: ${environmentName}`);
          }
