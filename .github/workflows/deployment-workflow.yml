name: Deploy to Railway

on:
  release:
    types:
      - created  # Trigger on new semantic release
  workflow_dispatch:  # Allows manual trigger of the workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Deploy to Railway (Int)
        uses: ./.github/actions/railway-deploy
        with:
          railway_token: ${{ secrets.INT_RAILWAY_TOKEN }}

  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: staging
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Deploy to Railway (Stage)
        uses: ./.github/actions/railway-deploy
        with:
          railway_token: ${{ secrets.STAGE_RAILWAY_TOKEN }}

  deploy-to-production:
    runs-on: ubuntu-latest
    needs: deploy-to-staging
    environment:
      name: production
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Deploy to Railway (Prod)
        uses: ./.github/actions/railway-deploy
        with:
          railway_token: ${{ secrets.PROD_RAILWAY_TOKEN }}
